plugins {
    id 'com.android.application'
}

def selectedDataset = (findProperty('galleryDataset') ?: 'mixed').toString()
// Folder name under assets/datasets/ — usually easy|mixed; custom names from generate_dataset.py --name.
if (!(selectedDataset ==~ /^[A-Za-z0-9][A-Za-z0-9_-]*$/)) {
    throw new GradleException(
        "galleryDataset must be a simple folder name (letters, digits, _-, starting alphanumeric); was: ${selectedDataset}"
    )
}

android {
    namespace 'com.cs426.gallery'
    compileSdk 35

    defaultConfig {
        applicationId "com.cs426.gallery"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0-v2-optimized"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "GALLERY_DATASET", "\"${selectedDataset}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
